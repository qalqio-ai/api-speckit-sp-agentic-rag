[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundational-multi-use-api"
version = "0.1.0"
description = "A small API exposing stable contracts across configured use cases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
f1 = [
    "sentence-transformers==6.1.0; sys_platform == 'linux' and python_version >= '3.12'",
    "qdrant-client==1.19.1; sys_platform == 'linux' and python_version >= '3.12'",
    "torch>=2.2; sys_platform == 'linux' and python_version >= '3.12'",
]
test = [
    "pytest>=8,<10",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

# F1 is isolated in Linux CPU containers; the native Stage 1 environment is untouched.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "f1" }]

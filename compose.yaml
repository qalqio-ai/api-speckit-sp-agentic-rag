services:
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY pyproject.toml README.md ./
        COPY app ./app
        RUN python -m pip install --no-cache-dir .
        CMD ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    ports:
      - "127.0.0.1:8000:8000"
